paths:
  source_dir: ~/Desktop/Photo
  cache_dir: ./cache
  data_dir: ./data
  logs_dir: ./logs
  ref_faces_dir: ./reference_faces
  directive_file: ./config/directive.txt
  db_path: ./data/photo_archive.db
  vectors_path: ./data/vectors.npy
  previews_dir: ./data/previews
  thumbs_360_dir: ./data/previews/thumbs_360
  previews_1600_dir: ./data/previews/previews_1600
  models_dir: ./data/models
  das_backup_dir: ~/Desktop/DAS_Catalog_Backup
catalogs:
- name: Keepers
  path: /Volumes/AerialCatalog/4_Landscape_Keepers
  lrcat_path: /Volumes/AerialCatalog/4_Landscape_Keepers/Terestrial -2.lrcat
  description: Mitch Rouse Master Landscape Keepers
exclusion_rules:
  excluded_dir_patterns:
  - '*.lrdata'
  - '*.lrcat*'
  - Smart Previews*
  - Backups
  - .Spotlight-V100
  - .Trashes
  - .fseventsd
  - __MACOSX
  - cache
  - thumbs_360
  - previews_1600
  excluded_file_patterns:
  - Pre-views.db
  - Previews.db
  - '*.lrcat'
  - '*.lrcat-wal'
  - '*.lrcat-shm'
  - '*.lrcat.lock'
  - .DS_Store
  - ._*
processing:
  supported_extensions:
  - .iiq
  - .nef
  - .arw
  - .cr2
  - .cr3
  - .dng
  - .raf
  - .orf
  - .rw2
  - .pef
  - .srw
  - .3fr
  - .tif
  - .tiff
  - .jpg
  - .jpeg
  - .png
  - .heic
  - .heif
  - .webp
  - .bmp
  raw_priority_extensions:
  - .iiq
  - .dng
  - .nef
  - .arw
  - .cr2
  - .cr3
  - .raf
  - .orf
  - .rw2
  - .pef
  - .srw
  - .3fr
  derivative_extensions:
  - .tif
  - .tiff
  - .dng
  - .jpg
  - .jpeg
  thumb_short_px: 360
  preview_long_px: 1600
  webp_thumb_quality: 82
  webp_preview_quality: 86
  sharpness_grid_size: 8
  sharpness_inner_grid: 6
  sharpness_percentile: 90
  sharpness_unsharp_threshold: 3.5
  clip_model: ViT-L-14
  clip_pretrained: openai
  vector_dim: 768
  sequence_max_delta_seconds: 10.0
  sequence_min_clip_similarity: 0.87
  keepers_phash_max_dist: 2
  vlm_model: qwen2.5vl:7b
  vram_flush_interval: 1000
  strafing_min_frames_for_stride: 10
  strafing_vlm_stride: 35
  strafing_sim_drop_threshold: 0.85
  orbit_time_window_seconds: 180.0
  centroid_similarity_threshold: 0.84
  confidence_review_threshold: 0.7
  aspect_ratio_pano_threshold: 2.1
  xmp_sync_mode: on_demand
  xmp_sync_batch_size: 25
  iiq_use_sidecar_only: true
